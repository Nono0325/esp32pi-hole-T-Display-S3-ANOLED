[platformio]
default_envs = t-display-s3-amoled
boards_dir = ./boards

[env]
platform = espressif32
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200

; ---- LilyGO T-Display-S3 AMOLED (Default) ----
[env:t-display-s3-amoled]
board = lilygo-t-amoled
board_build.partitions = partitions_16MB.csv
board_build.flash_size = 16MB
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DLILYGO_T_DISPLAY_S3_AMOLED

; ---- Standard ESP32-S3 DevKit configuration (alternative) ----
[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = partitions_16MB.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DLILYGO_T_DISPLAY_S3_AMOLED

; ---- Legacy ESP32-C3 (from original project) ----
[env:c3]
board = esp32-c3-devkitm-1
board_build.partitions = partitions.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---- Legacy ESP32 Dev ----
[env:esp32dev]
board = esp32dev
board_build.partitions = partitions.csv
